<div class="page-container">
  <div class="header">
    <h2 class="gradient-text">Users</h2>
    <p>Manage your platform users</p>
  </div>

  <div class="glass-card">
    @if (users.length === 0) {
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <p>No users found or loading...</p>
      </div>
    } @else {
      <div class="list-grid">
        @for (user of users; track user.id) {
          <div class="list-item">
            <div class="item-avatar">{{ user.name.charAt(0) }}</div>
            <div class="item-info">
              <h4>{{ user.name || 'User ' + user.id }}</h4>
              <span>ID: {{ user.id }}</span>
            </div>
            <button class="action-btn">View Profile</button>
          </div>
        }
      </div>
    }
  </div>
</div>

<style>
  .page-container {
    padding: 1rem;
    max-width: 1000px;
  }
  
  .header {
    margin-bottom: 2rem;
  }

  .header h2 {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
  }

  .header p {
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  .empty-icon {
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  .list-grid {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .list-item {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1rem 1.5rem;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    transition: all 0.2s ease;
  }

  .list-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .item-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: bold;
    color: white;
  }

  .item-info {
    flex: 1;
  }

  .item-info h4 {
    font-size: 1.1rem;
    margin-bottom: 0.25rem;
  }

  .item-info span {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .action-btn {
    padding: 0.625rem 1.25rem;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background: rgba(99, 102, 241, 0.2);
    transform: translateY(-1px);
  }
</style>
